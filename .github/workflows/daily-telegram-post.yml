name: Daily Telegram post

on:
  # DISABLED 2026-08-16: links every post it sends to ${BLOG_BASE_URL}, and only
  # 34 of the 224 posts on disk exist on www.nexitel.us — the other 190 return
  # 404. This queue picks the OLDEST unposted post, so 109 of its 115 remaining
  # picks are dead links, starting with the next run.
  # Also disabled server-side via `gh workflow disable "Daily Telegram post"`.
  # To re-enable: uncomment the schedule below AND run
  #   gh workflow enable "Daily Telegram post"
  #
  # 13:17 UTC ~ 9:17 AM Eastern. Off-the-hour to avoid the GitHub Actions
  # cron stampede that can delay jobs by 10+ minutes.
  # schedule:
  #   - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-audit --no-fund

      - name: Send Telegram posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_EN: ${{ secrets.TELEGRAM_CHAT_ID_EN }}
          TELEGRAM_CHAT_ID_ZH: ${{ secrets.TELEGRAM_CHAT_ID_ZH }}
          TELEGRAM_CHAT_ID_ES: ${{ secrets.TELEGRAM_CHAT_ID_ES }}
          BLOG_BASE_URL: ${{ vars.BLOG_BASE_URL || 'https://nexitel.com' }}
        run: npm run post:telegram

      - name: Commit updated posted-log
        run: |
          if ! git diff --quiet -- scripts/posted-log.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/posted-log.json
            git commit -m "chore: record telegram posts for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "posted-log.json unchanged; nothing to commit."
          fi
